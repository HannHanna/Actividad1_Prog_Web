<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Celsius a Fahrenheit | DevSolutions</title>
    <link rel="stylesheet" href="css/ejercicio10.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Conversor de Temperatura</h1>
        <p class="subtitulo">Ingresa los grados Celsius para obtener su equivalente en Fahrenheit.</p>

        <form id="form-conversor" class="formulario">
            <!-- Grupo 1: Celsius (Entrada) -->
            <div class="grupo-formulario">
                <label for="celsius">Temperatura en Celsius (°C)</label>
                <input type="text" id="celsius" placeholder="Ej: 25" required>
            </div>

            <!-- Grupo 2: Fahrenheit (Resultado readonly) -->
            <div class="grupo-formulario">
                <label for="fahrenheit">Temperatura en Fahrenheit (°F)</label>
                <input type="text" id="fahrenheit" placeholder="Resultado..." readonly>
            </div>

            <!-- Botón -->
            <button type="button" id="btn-convertir" class="boton-enviar">
                Convertir <span>→</span>
            </button>
        </form>
    </div>

    <!-- Script de JavaScript -->
    <script src="js/ejercicio10.js"></script>
    <a href="index.html" class="btn-volver">VOLVER AL MENÚ</a>
</body>
</html>
