<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cambiamos titulo | DevSolutions</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Conversor de Kilómetros</h1>
        <p class="subtitulo">Ingresa los kilómetros para obtener su equivalente en millas.</p>

        <form id="form-conversor" class="formulario">
            <!-- Grupo 1: Kilómetros (Entrada) -->
            <div class="grupo-formulario">
                <label for="kilometros">Distancia en Kilómetros (km)</label>
                <input type="text" id="kilometros" placeholder="Ej: 10" required>
            </div>

            <!-- Grupo 2: Millas (Resultado readonly) -->
            <div class="grupo-formulario">
                <label for="millas">Distancia en Millas (mi)</label>
                <input type="text" id="millas" placeholder="Resultado..." readonly>
            </div>

            <!-- Botón -->
            <button type="button" id="btn-convertir" class="boton-enviar">
                Convertir <span>→</span>
            </button>
        </form>
    </div>

    <!-- Script de JavaScript -->
    <script src="js/ejercicio11.js"></script>
    <a href="index.html" class="btn-volver">VOLVER AL MENÚ</a>
</body>
</html>
